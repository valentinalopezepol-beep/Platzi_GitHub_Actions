
name: Ejemplo de expresiones y contextos

run-name: >
  Despliegue de ${{ github.repository }}
  por ${{ github.actor }}
  - Entorno: ${{ inputs.entorno }}

on:
  push:
    branches:
      - main
      - aprendiendo-github-actions

  pull_request:
    branches:
      - main

  workflow_dispatch:
    inputs:
      entorno:
        description: "Entorno de despliegue"
        required: true
        type: choice
        options:
          - development
          - staging
          - production

      ejecutar_tests:
        description: "¿Ejecutar pruebas?"
        required: true
        type: boolean
        default: true

      version:
        description: "Versión de la aplicación"
        required: false
        type: string
        default: "1.0.0"

env:
  APP_NAME: mi-aplicacion
  VERSION: ${{ inputs.version || '1.0.0' }}

jobs:

  # JOB 1: Información inicial
  informacion:
    name: Información del workflow
    runs-on: ubuntu-latest

    outputs:
      entorno: ${{ steps.configuracion.outputs.entorno }}

    steps:
      - name: Mostrar información
        run: |
          echo "Repositorio: ${{ github.repository }}"
          echo "Actor: ${{ github.actor }}"
          echo "Evento: ${{ github.event_name }}"
          echo "Rama: ${{ github.ref_name }}"
          echo "Versión: ${{ env.VERSION }}"

      - name: Configurar entorno
        id: configuracion
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "entorno=production" >> "$GITHUB_OUTPUT"
          else
            echo "entorno=development" >> "$GITHUB_OUTPUT"
          fi

  # JOB 2: Pruebas
  pruebas:
    name: Ejecutar pruebas
    runs-on: ubuntu-latest
    needs: informacion

    if: ${{ github.event_name != 'pull_request' }}

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Ejecutar tests
        if: ${{ inputs.ejecutar_tests != false }}
        run: echo "Ejecutando pruebas..."

      - name: Omitir tests
        if: ${{ inputs.ejecutar_tests == false }}
        run: echo "Las pruebas fueron omitidas."

      - name: Mostrar resultado
        if: ${{ success() }}
        run: echo "El job terminó correctamente."

  # JOB 3: Construcción
  build:
    name: Construir aplicación
    runs-on: ubuntu-latest
    needs: [informacion, pruebas]

    steps:
      - name: Construir
        run: |
          echo "Construyendo $APP_NAME"
          echo "Versión: $VERSION"

      - name: Mostrar runner
        run: |
          echo "Sistema operativo: ${{ runner.os }}"
          echo "Arquitectura: ${{ runner.arch }}"

  # JOB 4: Despliegue
  deploy:
    name: Desplegar aplicación
    runs-on: ubuntu-latest
    needs: [informacion, pruebas, build]

    if: >-
      ${{
        github.event_name != 'pull_request' &&
        needs.informacion.outputs.entorno == 'production'
      }}

    environment: production

    steps:
      - name: Desplegar
        run: |
          echo "Desplegando aplicación..."
          echo "Entorno: ${{ needs.informacion.outputs.entorno }}"
          echo "Repositorio: ${{ github.repository }}"

      - name: Finalización
        if: ${{ always() }}
        run: echo "El proceso de despliegue ha finalizado."
